services:
  - type: web
    name: ai-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
